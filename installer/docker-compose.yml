name: claimer-control

services:
  app:
    image: ghcr.io/rafaelcairess/lontrium:${CLAIMER_TAG:-latest}
    container_name: claimer-control
    # Windows Task Scheduler owns lifecycle in packaged installs. Automatic
    # container restart would keep Docker/WSL resident after an economy run.
    restart: "no"
    cpus: ${CLAIMER_CPU_LIMIT:-2.0}
    mem_limit: ${CLAIMER_MEMORY_LIMIT:-2g}
    pids_limit: ${CLAIMER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:${NOVNC_PORT:-7080}:7080"
      - "127.0.0.1:${GUI_PORT:-8080}:8080"
    volumes:
      - claimer_data:/fgc/data
    environment:
      GUI_ENABLED: "true"
      GUI_SETUP_REQUIRED: "true"
      GUI_PORT: "8080"
      WINDOWS_HOST_SCHEDULER: "true"
      WINDOWS_ECONOMY_SCHEDULE: "${WINDOWS_ECONOMY_SCHEDULE:-true}"
      WINDOWS_WAKE_ON_AC: "${WINDOWS_WAKE_ON_AC:-true}"
      STORE_RUN_TIMEOUT: "${STORE_RUN_TIMEOUT:-900}"
      CLAIM_RUN_TIMEOUT: "${CLAIM_RUN_TIMEOUT:-2700}"
      GUI_IDLE_TIMEOUT: "${GUI_IDLE_TIMEOUT:-1800}"
      RUN_ON_STARTUP: "${RUN_ON_STARTUP:-false}"
      SCHEDULER_HOURS: "${SCHEDULER_HOURS:-0}"
      SCHEDULER_FIXED_TIMES: "${SCHEDULER_FIXED_TIMES:-12:00,16:00,19:00}"
      NOTIFY_UPDATES: "true"
      CLEAN_BROWSER_CACHE_ON_STARTUP: "true"
    healthcheck:
      test: ["CMD-SHELL", "pgrep python3 && curl --fail http://localhost:8080/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  claimer_data:
    name: ${CLAIMER_DATA_VOLUME:-claimer-control-data}

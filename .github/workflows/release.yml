name: Test and publish Lontrium Control

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python, frontend and launcher tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: |
          node --check src/gui/static/app.js
          node --check src/gui/static/i18n.js
          node --test tests/test_i18n.js
      - name: Locale JSON
        shell: pwsh
        run: Get-ChildItem src/gui/static/locales/*.json | ForEach-Object { Get-Content -Raw $_ | ConvertFrom-Json | Out-Null }
      - name: Launcher syntax and packaged files
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/Start-ClaimerControl.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          & ./installer/Start-ClaimerControl.ps1 -Action check -Language en
      - name: Launcher control flow
        shell: pwsh
        run: Invoke-Pester -Path tests/installer.Tests.ps1 -Output Detailed

  image:
    name: Publish container
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/rafaelcairess/free-games-claimer-remaster-gui
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
            NOW=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify that the installer can pull the image anonymously
        shell: bash
        run: |
          docker logout ghcr.io
          if ! docker pull "ghcr.io/${GITHUB_REPOSITORY}:latest"; then
            echo "Make the GHCR package public, then rerun this workflow. The Release was not created." >&2
            exit 1
          fi
          docker pull "ghcr.io/rafaelcairess/free-games-claimer-remaster-gui:latest"

  installer:
    name: Build Windows installer
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release version in packaged files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Invalid release tag: $tag" }
          $version = $Matches[1]
          (Get-Content installer/claimer.env) -replace '^CLAIMER_TAG=.*$', "CLAIMER_TAG=$tag" | Set-Content installer/claimer.env -Encoding utf8
          (Get-Content installer/ClaimerControl.iss) -replace '^#define MyAppVersion .*$', "#define MyAppVersion `"$version`"" | Set-Content installer/ClaimerControl.iss -Encoding utf8
      - name: Build native Windows notification helper
        run: dotnet build installer/windows-notifier/Lontrium.Notifier.csproj -c Release --nologo
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ClaimerControl.iss'
      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $file = Get-Item installer/output/Lontrium-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content installer/output/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: lontrium-windows
          path: |
            installer/output/Lontrium-Setup.exe
            installer/output/SHA256SUMS.txt

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lontrium-windows
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: "Lontrium Control ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/Lontrium-Setup.exe
            release-assets/SHA256SUMS.txt

services:
  # ---------------------------------------------------------------
  # Free Games Claimer Remaster
  # ---------------------------------------------------------------
  app:
    # Pin CLAIMER_TAG to a Release for reproducible installs; source users may use latest.
    image: ghcr.io/rafaelcairess/lontrium:${CLAIMER_TAG:-latest}
    container_name: fgc-remaster
    build: .
    restart: "no"
    mem_limit: ${CLAIMER_MEMORY_LIMIT:-2g}
    pids_limit: ${CLAIMER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:${NOVNC_PORT:-7080}:7080"
      - "127.0.0.1:${GUI_PORT:-8080}:8080"
    volumes:
      - fgc_data:/fgc/data
    env_file:
      - .env
    environment:
      CLEAN_BROWSER_CACHE_ON_STARTUP: ${CLEAN_BROWSER_CACHE_ON_STARTUP:-true}
    healthcheck:
      test: pgrep python3 && curl --fail http://localhost:7080 || exit 1
      interval: 10s
      timeout: 5s

volumes:
  fgc_data:
